name: POS Safety Tests

on:
  push:
    branches:
      - fix/pos-barcode-mobile-payment-safety
  pull_request:
    branches:
      - main

jobs:
  pos-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run isolated POS safety tests
        run: npm run test:pos
      - name: Type-check application
        run: npm run lint
      - name: Build application
        run: npm run build
