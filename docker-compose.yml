# ==============================================================================
# Docker Compose Configuration for Khatinoo
# ==============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: khatinoo_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-khatinoo_db}
      POSTGRES_USER: ${POSTGRES_USER:-khatinoo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Tehran
    volumes:
      - khatinoo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-khatinoo_user} -d ${POSTGRES_DB:-khatinoo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - khatinoo_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: khatinoo_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-khatinoo_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-khatinoo_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://khatynoo.ir,https://www.khatynoo.ir}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - khatinoo_uploads:/app/uploads
    networks:
      - khatinoo_network

volumes:
  khatinoo_pgdata:
    name: khatinoo_pgdata
  khatinoo_uploads:
    name: khatinoo_uploads

networks:
  khatinoo_network:
    name: khatinoo_network
    driver: bridge
