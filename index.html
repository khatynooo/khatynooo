    <script>
      // Early error, console filter, and unhandled rejection suppressor for iframe / AbortSignals
      (function() {
        var originalConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var isAbort = args.some(function(arg) {
            if (!arg) return false;
            var str = (arg && (arg.message || arg.stack || arg.name || String(arg))) || '';
            return str.includes('AbortError') || str.includes('signal is aborted') || str.includes('ResizeObserver');
          });
          if (isAbort) return;
          originalConsoleError.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function(event) {
          var r = event.reason;
          if (
            !r ||
            r === 'undefined' ||
            r.name === 'AbortError' ||
            (r.message && (r.message.includes('aborted') || r.message.includes('ServiceWorker') || r.message.includes('AbortError'))) ||
            (typeof r === 'string' && (r.includes('AbortError') || r.includes('aborted')))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          if (
            !event.error ||
            msg === 'Script error.' ||
            msg === 'undefined' ||
            msg.includes('ResizeObserver') ||
            msg.includes('AbortError') ||
            msg.includes('aborted')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
